<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Signature{% endblock %}</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #1f4d3a; --accent-ink: #ffffff; --error: #9b2c2c; --error-bg: #fbeaea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1e1e1c; --ink: #ecebe7; --muted: #9c9b96; --line: #2f2f2c;
      --accent: #7fc4a4; --accent-ink: #10221a; --error: #f2a3a3; --error-bg: #3a1f1f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  .brand { font-weight: 600; letter-spacing: .02em; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 32px 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  input, select, textarea { width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
         background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  .error { background: var(--error-bg); color: var(--error); padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
  ul.points { margin: 0; padding-left: 20px; }
  ul.points li { margin: 4px 0; }
  details { margin-top: 16px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } main { padding-top: 24px; } }
</style>
</head>
<body>
<main>
  <div class="brand">Signature</div>
  {% block content %}{% endblock %}
</main>
</body>
</html>
