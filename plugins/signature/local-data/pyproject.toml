[project]
name = "signature-local-data"
version = "0.1.0"
description = "Opens a customer's files and databases in one locked, read-only DuckDB; reports their structure and runs Signature's SQL."
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6,<2",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signature_local_data"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PTH"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
